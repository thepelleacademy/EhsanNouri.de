<!doctype html>
<html lang="en" dir="ltr" data-theme="cyan">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Ehsan Nouri – Mechanical R&amp;D and Mechatronics</title>
    <meta name="description" content="Ehsan Nouri, mechanical R&amp;D engineer in Bavaria: precision design, test rigs, scientific instrumentation. Projects, career and certificates." />
    <meta property="og:title" content="Ehsan Nouri – Mechanical R&amp;D and Mechatronics" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Apply the saved (or system) theme before first paint, so there is no flash.
      (function () {
        var THEMES = ['cyan', 'amber', 'red', 'drafting', 'anodized', 'scope'];
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (THEMES.indexOf(t) < 0) {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'drafting' : 'cyan';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <a class="skip" href="#stage" data-i18n="ui.skip">Skip to content</a>

    <!-- ===================== TOP BAR ===================== -->
    <header class="bar" id="bar">
      <a class="brand" href="#/" aria-label="Ehsan Nouri">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="14.5" />
          <circle cx="16" cy="16" r="5" />
          <path d="M16 1.5v6M16 24.5v6M1.5 16h6M24.5 16h6" />
        </svg>
        <span class="brand-name" data-i18n="hero.name">Ehsan Nouri</span>
      </a>

      <nav class="tabs" id="tabs" aria-label="Sections"></nav>

      <div class="bar-tools">
        <div class="seg" id="lang" role="group" aria-label="Language">
          <button type="button" data-lang="fa" lang="fa">فا</button>
          <button type="button" data-lang="en" lang="en">EN</button>
          <button type="button" data-lang="de" lang="de">DE</button>
        </div>
        <div class="theme-pick">
          <button class="icon-btn" id="theme-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="theme-pop">
            <span class="swatch-dot" aria-hidden="true"></span>
            <span class="sr" data-i18n="ui.theme">Theme</span>
          </button>
          <div class="pop" id="theme-pop" hidden></div>
        </div>
      </div>
    </header>

    <!-- ===================== STAGE: one panel visible at a time ===================== -->
    <main class="stage" id="stage" tabindex="-1">
      <!-- OVERVIEW -->
      <section class="panel panel-overview" data-panel="overview" aria-labelledby="hero-name">
        <div class="hero">
          <div class="hero-copy">
            <h1 class="hero-name" id="hero-name" data-i18n="hero.name">Ehsan Nouri</h1>
            <p class="hero-role" data-i18n="hero.role"></p>
            <p class="hero-lede" data-i18n="hero.lede"></p>
            <ul class="chips" id="hero-chips"></ul>
            <div class="actions">
              <a class="btn btn-solid" href="#/projects" data-i18n="hero.ctaProjects"></a>
              <a class="btn btn-line" href="#/contact" data-i18n="hero.ctaContact"></a>
            </div>
          </div>
          <figure class="viewer" id="viewer">
            <canvas id="scene" aria-hidden="true"></canvas>
            <figcaption>
              <span data-i18n="ui.viewCaption"></span>
              <span class="hint" data-i18n="ui.viewerHint"></span>
            </figcaption>
          </figure>
        </div>
        <nav class="tiles" id="tiles" aria-label="Sections"></nav>
      </section>

      <!-- ABOUT -->
      <section class="panel" data-panel="about" aria-labelledby="about-title" hidden>
        <header class="panel-head">
          <h2 id="about-title" data-i18n="about.title"></h2>
        </header>
        <div class="about">
          <figure class="portrait"><img id="portrait" alt="" width="720" height="960" decoding="async" /></figure>
          <div class="about-text">
            <div id="about-paragraphs"></div>
            <dl class="facts" id="about-facts"></dl>
          </div>
          <div class="about-skills">
            <h3 data-i18n="about.skillsTitle"></h3>
            <div id="about-skills"></div>
          </div>
        </div>
      </section>

      <!-- CAREER -->
      <section class="panel" data-panel="career" aria-labelledby="career-title" hidden>
        <header class="panel-head">
          <h2 id="career-title" data-i18n="career.title"></h2>
        </header>
        <div class="career">
          <div class="career-list" id="career-list" role="list"></div>
          <article class="career-detail" id="career-detail" aria-live="polite"></article>
        </div>
      </section>

      <!-- PROJECTS -->
      <section class="panel" data-panel="projects" aria-labelledby="projects-title" hidden>
        <header class="panel-head">
          <div>
            <h2 id="projects-title" data-i18n="projects.title"></h2>
            <p class="panel-sub" data-i18n="projects.subtitle"></p>
          </div>
          <div class="filters" id="project-filters" role="group" aria-label="Filter"></div>
        </header>
        <div class="projects" id="projects-grid"></div>
      </section>

      <!-- CERTIFICATES -->
      <section class="panel panel-certs" data-panel="certificates" aria-labelledby="certs-title" hidden>
        <header class="panel-head">
          <div>
            <h2 id="certs-title" data-i18n="certificates.title"></h2>
            <p class="panel-sub" data-i18n="certificates.subtitle"></p>
          </div>
          <div class="filters" id="cert-filters" role="group" aria-label="Filter"></div>
        </header>
        <div class="ring-stage" id="ring-stage">
          <div class="ring" id="ring" role="listbox" tabindex="0" aria-roledescription="carousel"></div>
        </div>
        <div class="ring-caption">
          <button class="icon-btn" type="button" id="ring-prev"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg><span class="sr" data-i18n="ui.prev"></span></button>
          <div class="ring-info" id="ring-info" aria-live="polite"></div>
          <button class="icon-btn" type="button" id="ring-next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg><span class="sr" data-i18n="ui.next"></span></button>
        </div>
        <p class="ring-hint" data-i18n="ui.ringHint"></p>
      </section>

      <!-- CONTACT -->
      <section class="panel panel-contact" data-panel="contact" aria-labelledby="contact-title" hidden>
        <div class="contact">
          <h2 id="contact-title" data-i18n="contact.title"></h2>
          <p class="contact-text" data-i18n="contact.text"></p>
          <a class="contact-mail" id="contact-mail" href="#"></a>
          <div class="actions" id="contact-links"></div>
          <p class="contact-loc" data-i18n="contact.location"></p>
        </div>
      </section>
    </main>

    <!-- ===================== MOBILE TAB BAR ===================== -->
    <nav class="dock" id="dock" aria-label="Sections"></nav>

    <footer class="foot">
      <span>© <span id="year"></span> Ehsan Nouri. <span data-i18n="footer.rights"></span></span>
      <a href="#/legal" id="legal-link" data-i18n="ui.legal"></a>
    </footer>

    <!-- ===================== SHEET (project detail, certificate viewer, legal) ===================== -->
    <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
      <div class="sheet-body" id="sheet-body"></div>
      <button class="icon-btn sheet-close" type="button" id="sheet-close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        <span class="sr" data-i18n="ui.close"></span>
      </button>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
