<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#02030a" />
    <title>Ehsan Nouri – Mechanical R&amp;D &amp; Mechatronics Engineer</title>
    <meta
      name="description"
      content="Portfolio of Ehsan Nouri: precision mechanical design, experimental prototyping, scientific instrumentation, projects, work experience, education and certificates."
    />
    <meta property="og:title" content="Ehsan Nouri – Mechanical R&amp;D &amp; Mechatronics Engineer" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <a class="skip" href="#main" data-i18n="nav.home">Home</a>

    <header class="nav" id="nav">
      <a class="brand" href="#home" aria-label="Ehsan Nouri">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">EN<span>.</span>de</span>
      </a>

      <nav class="nav-links" id="nav-links" aria-label="Main">
        <a href="#about" data-i18n="nav.about">About</a>
        <a href="#experience" data-i18n="nav.experience">Experience</a>
        <a href="#education" data-i18n="nav.education">Education</a>
        <a href="#projects" data-i18n="nav.projects">Projects</a>
        <a href="#certificates" data-i18n="nav.certificates">Certificates</a>
        <a href="#skills" data-i18n="nav.skills">Skills</a>
        <a href="#contact" data-i18n="nav.contact">Contact</a>
      </nav>

      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="fa" lang="fa">فا</button>
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="de" lang="de">DE</button>
      </div>

      <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
        <span></span><span></span><span></span>
      </button>
    </header>

    <main id="main">
      <!-- HERO -->
      <section class="hero" id="home">
        <div class="hero-inner">
          <p class="eyebrow" data-i18n="hero.hello">Hello, I am</p>
          <h1 class="glitch" id="hero-name" data-i18n="hero.name">Ehsan Nouri</h1>
          <p class="role" data-i18n="hero.role">Mechanical R&amp;D Engineer · Mechatronics</p>
          <p class="tagline" data-i18n="hero.tagline"></p>
          <div class="cta">
            <a class="btn btn-primary" href="#projects" data-i18n="hero.ctaProjects">View projects</a>
            <a class="btn btn-ghost" href="#contact" data-i18n="hero.ctaContact">Get in touch</a>
          </div>
        </div>
        <a class="scroll-hint" href="#about" aria-label="Scroll">
          <span data-i18n="hero.scroll">Scroll</span>
          <i aria-hidden="true"></i>
        </a>
      </section>

      <!-- ABOUT -->
      <section class="section" id="about">
        <div class="wrap">
          <h2 class="section-title reveal" data-i18n="about.title">About me</h2>
          <div class="about-grid">
            <div class="panel reveal tilt">
              <p data-i18n="about.p1"></p>
              <p data-i18n="about.p2"></p>
            </div>
            <div class="about-side">
              <figure class="portrait panel reveal tilt">
                <img id="portrait" alt="Ehsan Nouri" width="360" height="493" loading="lazy" decoding="async" />
              </figure>
              <div class="stats" id="stats"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- EXPERIENCE -->
      <section class="section" id="experience">
        <div class="wrap">
          <h2 class="section-title reveal" data-i18n="experience.title">Work experience</h2>
          <div class="timeline" id="experience-list"></div>
        </div>
      </section>

      <!-- EDUCATION -->
      <section class="section" id="education">
        <div class="wrap">
          <h2 class="section-title reveal" data-i18n="education.title">Education</h2>
          <div class="timeline" id="education-list"></div>
        </div>
      </section>

      <!-- PROJECTS -->
      <section class="section" id="projects">
        <div class="wrap">
          <h2 class="section-title reveal" data-i18n="projects.title">Projects</h2>
          <p class="section-sub reveal" data-i18n="projects.subtitle"></p>
          <div class="cards" id="projects-list"></div>
        </div>
      </section>

      <!-- CERTIFICATES -->
      <section class="section" id="certificates">
        <div class="wrap">
          <h2 class="section-title reveal" data-i18n="certificates.title">Certificates</h2>
          <p class="section-sub reveal" data-i18n="certificates.subtitle"></p>
          <div class="cards cards-small" id="certificates-list"></div>
        </div>
      </section>

      <!-- SKILLS -->
      <section class="section" id="skills">
        <div class="wrap">
          <h2 class="section-title reveal" data-i18n="skills.title">Skills</h2>
          <div class="cards" id="skills-list"></div>
        </div>
      </section>

      <!-- CONTACT -->
      <section class="section section-contact" id="contact">
        <div class="wrap">
          <div class="panel contact-panel reveal tilt">
            <h2 class="section-title" data-i18n="contact.title">Let's talk</h2>
            <p data-i18n="contact.text"></p>
            <p class="loc" id="contact-location"></p>
            <div class="cta" id="contact-links"></div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>© <span id="year"></span> Ehsan Nouri. <span data-i18n="footer.rights"></span></span>
      <span class="muted" data-i18n="footer.legal"></span>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
