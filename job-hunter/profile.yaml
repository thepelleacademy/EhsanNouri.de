# ----------------------------------------------------------------------------
#  الگوهای متنی
# ----------------------------------------------------------------------------
patterns:
  german_required_strong:
    - "verhandlungssicher"
    - "flie(ß|ss)end(e|es)?\\s+deutsch"
    - "deutsch(kenntnisse)?[^.\\n]{0,30}(c1|c2|flie(ß|ss)end|verhandlungssicher|muttersprache|ausgezeichnet)"
    - "sehr gute[n]?\\s+deutschkenntnisse"
    - "german[^.\\n]{0,25}(fluent|native|c1|c2|proficien|business)"
    - "deutsch\\s+in\\s+wort\\s+und\\s+schrift"
  german_required_moderate:
    - "gute[n]?\\s+deutschkenntnisse"
    - "deutschkenntnisse"
    - "german[^.\\n]{0,25}(b2|good|required)"
  english_friendly:
    - "english (is|as) (our |the )?(working|company|business) language"
    - "working language[^.\\n]{0,20}english"
    - "no german (is )?(required|needed)"
    - "german (is )?(a plus|nice to have|not required|an advantage)"
    - "international team"
    - "international environment"
    - "englisch (als )?(arbeits|firmen|konzern)sprache"
    - "englischsprachig"
  startup_signals:
    - "start-?up"
    - "scale-?up"
    - "junges (team|unternehmen)"
    - "young (team|company)"
    - "gründer"
    - "founder"
    - "seed"
    - "series [ab]\\b"
    - "kleines team"
    - "small team"
    - "flache hierarchien"
    - "flat hierarchies"
    - "wachsend(es|en)? (team|unternehmen)"
    - "fast-growing"
    - "all-?rounder"
    - "hands-on"
    - "vielseitig"
    - "abwechslungsreich"
  large_signals:
    - "weltweit führend"
    - "global player"
    - "konzern"
    - "über \\d{2}\\.?\\d{3} mitarbeiter"
    - "more than \\d{2},?\\d{3} (employees|people)"
