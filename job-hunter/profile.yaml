# ============================================================================
#  profile.yaml — همه‌ی تنظیمات Job Hunter اینجاست (متغیرهای نام‌دار، دستی قابل تغییر)
#  Ehsan Nouri — Mechanical R&D / Design Engineer
# ============================================================================

candidate:
  name: "Ehsan Nouri"
  location: "Deggendorf, Bavaria, Germany"
  german_level: "A2"          # در حال یادگیری
  english_level: "fluent"
  summary: >
    Mechanical R&D engineer (10+ years) specialising in precision mechanical design, experimental
    prototyping and scientific instrumentation. CAD (CATIA, SolidWorks incl. CSWA/CSWA-AM/xDesign
    certificates, AutoCAD), FEA/CFD (ANSYS, Abaqus), GD&T technical drawings, Additive Manufacturing
    (FDM, process optimisation, needle-insertion printing), CNC/fabrication management, dimensional
    metrology, sensor integration and electromechanical prototyping, firmware (Marlin) and Python.
    Experience: optical-gyroscope housings (CATIA), MIL-STD-810 shock/vibration isolators (wire-rope
    isolators), 2-DOF helicopter and propeller test rigs, satellite transport container, hybrid
    solar-wind prototype, tensile/strain testing of polymers, FMEA and failure analysis.
    Education: MSc Analytical Instruments, Measurement & Sensor Technology (Coburg), MSc
    Mechatronics & Cyber-Physical Systems (Deggendorf, ongoing), BSc Mechanical Engineering.
    Languages: English fluent, German A2 (learning), Persian native, Azerbaijani fluent.
    Looking for a versatile all-rounder role in a small / young / international company in Germany.

# ----------------------------------------------------------------------------
#  Run settings
# ----------------------------------------------------------------------------
settings:
  lookback_days_daily: 3            # هر اجرا چند روز اخیر را می‌گیرد (هم‌پوشانی برای اطمینان)
  backfill_days_first_run: 14       # اولین اجرا چند روز عقب برود
  max_details_fetch: 60             # حداکثر درخواست جزئیات آگهی (Arbeitsagentur) در هر اجرا
  request_delay_seconds: 0.4
  min_rule_score_for_ai: 30         # حداقل امتیاز قانون‌محور برای رفتن به AI
  ai_max_jobs_per_run: 30
  ai_batch_size: 6
  min_publish_score: 40             # حداقل امتیاز نهایی برای نمایش در سایت
  notify_min_score: 60              # حداقل امتیاز برای آلارم تلگرام
  notify_max_items: 8
  notify_even_if_empty: true        # حتی بدون نتیجه‌ی خوب هم یک پیام کوتاه بفرست
  keep_days: 45                     # آگهی‌ها چند روز در دیتابیس بمانند

ai:
  provider: "gemini"
  model: "gemini-2.5-flash"         # با متغیر محیطی GEMINI_MODEL قابل تغییر
  daily_budget_usd: 0.10            # سقف سخت هزینه‌ی روزانه
  price_in_per_mtok: 0.30           # قیمت ورودی (دلار به ازای یک میلیون توکن) — اگر تغییر کرد اصلاح کن
  price_out_per_mtok: 2.50
  max_output_tokens: 2500
  desc_chars_per_job: 1400

