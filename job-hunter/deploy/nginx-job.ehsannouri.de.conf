# /etc/nginx/sites-available/job.ehsannouri.de  (ln -s to sites-enabled, nginx -t, systemctl reload nginx)
#
# Access control is the login page in the app itself: data/jobs.enc.json is AES-256-GCM encrypted and can only
# be decrypted with JOB_USERNAME + JOB_PASSWORD (entered in the browser). No basic-auth here.
# TLS after DNS (A record job -> server IP):  certbot --nginx -d job.ehsannouri.de

server {
    listen 80;
    server_name job.ehsannouri.de;

    root /var/www/job.ehsannouri.de;      # = secret JOB_DEPLOY_PATH in GitHub
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    location ~ ^/data/ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
