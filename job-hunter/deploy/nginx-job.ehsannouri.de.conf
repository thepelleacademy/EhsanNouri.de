# /etc/nginx/sites-available/job.ehsannouri.de   (then: ln -s into sites-enabled, nginx -t, systemctl reload nginx)
#
# Password-protected (HTTP basic auth): the page is for you only. Create the password file once:
#   apt install apache2-utils
#   htpasswd -c /etc/nginx/.htpasswd-job ehsan
#
# TLS: after DNS (A record job -> server IP) is set, run:  certbot --nginx -d job.ehsannouri.de

server {
    listen 80;
    server_name job.ehsannouri.de;

    root /var/www/job.ehsannouri.de;      # = secret JOB_DEPLOY_PATH in GitHub
    index index.html;

    auth_basic           "Job Hunter";
    auth_basic_user_file /etc/nginx/.htpasswd-job;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /data/jobs.json {
        add_header Cache-Control "no-store";
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
